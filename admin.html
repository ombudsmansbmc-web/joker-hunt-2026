<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Joker Hunt 2026 — Admin</title>
<link rel="stylesheet" href="style.css">
<style>
.admin-wrap{max-width:1200px;margin:0 auto;padding:28px 16px}.admin-card{max-width:460px;margin:8vh auto;padding:24px;border:1px solid #444;border-radius:14px;background:#111}.admin-card input{width:100%;box-sizing:border-box;margin:8px 0 14px;padding:12px}.admin-actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.admin-table-wrap{overflow-x:auto;border:1px solid #333;border-radius:12px}.admin-table{width:100%;border-collapse:collapse;min-width:1050px}.admin-table th,.admin-table td{padding:10px;border-bottom:1px solid #333;text-align:left;white-space:nowrap}.admin-table th{background:#161616}.admin-score{font-weight:800;font-size:1.15em}.muted{opacity:.7}.error{color:#ff7676}.admin-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
</style>
</head>
<body>
<main class="admin-wrap">
<section id="login-view" class="admin-card">
<div class="eyebrow">HAHA</div><h1>JOKER HUNT ADMIN</h1>
<p>Sign in to view the final standings.</p>
<label>Email</label><input id="admin-email" type="email" autocomplete="username">
<label>Password</label><input id="admin-password" type="password" autocomplete="current-password">
<button id="admin-login">SIGN IN</button>
<p id="login-feedback" class="feedback"></p>
</section>
<section id="results-view" hidden>
<div class="admin-head"><div><div class="eyebrow">JOKER HUNT 2026</div><h1>FINAL STANDINGS</h1><p class="muted">Highest score first. Equal scores are ranked by fastest total time.</p></div>
<div class="admin-actions"><button id="refresh-results">REFRESH RESULTS</button><button id="admin-logout">LOG OUT</button></div></div>
<p id="results-feedback" class="feedback"></p>
<div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>#</th><th>Team</th><th>Players</th><th>Total</th><th>Time</th><th>Normal</th><th>HAHA</th><th>Socks</th><th>Photo</th><th>Code bonus</th><th>Code attempts</th><th>Finished</th></tr></thead><tbody id="results-body"></tbody></table></div>
</section>
</main>
<script src="admin.js?v=1"></script>
</body></html>
